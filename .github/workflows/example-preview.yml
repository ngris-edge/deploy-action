# Example: copy this into YOUR repo at .github/workflows/ngris.yml
# Pull requests get a preview that is not live; closing a PR turns its preview off.
# To also deploy to production on a push to your default branch, add under `on:`
#   push:
#     branches: [main]
name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: ngris-edge/deploy-action@v1
        with:
          api-key: ${{ secrets.NGRIS_API_KEY }}
          build-command: npm ci && npm run build
          dir: dist
